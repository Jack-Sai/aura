[package]
name = "aura"
version = "0.2.5"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
reqwest = { version = "0.13.5", features = ["stream", "json"] }
futures-util = "0.3.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
bytes = "1.12.1"
tokio = { version = "1.53.2", features = ["sync", "macros", "time", "rt"] }
tauri-plugin-dialog = "2.8.1"
regex = "1.10"

[features]
# 生产构建启用；tauri dev 由 CLI 以 --no-default-features 关闭以使用 devUrl
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
